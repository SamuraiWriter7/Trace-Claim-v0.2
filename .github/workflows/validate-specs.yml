name: Validate Trace Claim v0.2

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Debug file tree
        run: |
          echo "=== Repository file tree ==="
          find . -maxdepth 4 -type f | sort

      - name: Validate trace claim v0.2 schema and sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml
          from jsonschema import Draft202012Validator

          print("=== Validating Trace Claim v0.2 repository ===")

          schema_path = Path("schemas/trace-claim-v0.2.schema.json")
          sample_path = Path("examples/trace-claim-v0.2.sample.yaml")

          failed = False

          def require_file(path: Path, label: str):
              global failed
              if not path.exists():
                  print(f"ERROR: {label} file not found: {path}")
                  failed = True
                  return False
              return True

          def load_json(path: Path, label: str):
              global failed
              try:
                  with path.open("r", encoding="utf-8") as f:
                      data = json.load(f)
                  print(f"OK: {label} JSON parsed successfully: {path}")
                  return data
              except json.JSONDecodeError as e:
                  print(f"ERROR: Invalid JSON in {label} file {path}: {e}")
                  failed = True
                  return None
              except Exception as e:
                  print(f"ERROR: Failed to read {label} file {path}: {e}")
                  failed = True
                  return None

          def load_yaml(path: Path, label: str):
              global failed
              try:
                  with path.open("r", encoding="utf-8") as f:
                      data = yaml.safe_load(f)
                  print(f"OK: {label} YAML parsed successfully: {path}")
                  return data
              except yaml.YAMLError as e:
                  print(f"ERROR: Invalid YAML in {label} file {path}: {e}")
                  failed = True
                  return None
              except Exception as e:
                  print(f"ERROR: Failed to read {label} file {path}: {e}")
                  failed = True
                  return None

          def validate_schema(schema_data, schema_path: Path, label: str):
              global failed
              try:
                  Draft202012Validator.check_schema(schema_data)
                  print(f"OK: {label} schema is valid: {schema_path}")
              except Exception as e:
                  print(f"ERROR: Invalid JSON Schema in {label} file {schema_path}: {e}")
                  failed = True

          def validate_instance(instance, schema_data, instance_path: Path, label: str):
              global failed
              try:
                  Draft202012Validator(schema_data).validate(instance)
                  print(f"OK: {label} is valid against schema: {instance_path}")
              except Exception as e:
                  print(f"ERROR: {label} validation failed for {instance_path}: {e}")
                  failed = True

          print("\n=== Checking required files ===")
          schema_ok = require_file(schema_path, "Trace claim v0.2 schema")
          sample_ok = require_file(sample_path, "Trace claim v0.2 sample")

          print("\n=== Loading files ===")
          schema_data = load_json(schema_path, "Trace claim v0.2 schema") if schema_ok else None
          sample_data = load_yaml(sample_path, "Trace claim v0.2 sample") if sample_ok else None

          print("\n=== Validating schema ===")
          if schema_data is not None:
              validate_schema(schema_data, schema_path, "Trace claim v0.2")

          print("\n=== Validating sample against schema ===")
          if sample_data is not None and schema_data is not None:
              if not isinstance(sample_data, dict):
                  print(f"ERROR: Trace claim v0.2 sample root must be a mapping/object: {sample_path}")
                  failed = True
              else:
                  validate_instance(sample_data, schema_data, sample_path, "Trace claim v0.2 sample")

          print("\n=== Summary ===")
          print(f"Schema: {schema_path}")
          print(f"Sample: {sample_path}")

          if failed:
              print("\nValidation failed.")
              raise SystemExit(1)

          print("\nAll validations passed.")
          PY


